name: Re-run builds that lost a runner

# GitHub accepts a job, cannot find a hosted runner for it within its queue limit
# (fifteen minutes), and cancels it. The whole Build all run then goes red with
# nothing in the repository broken: seven of the sixteen failed or cancelled runs
# in the last sixty were exactly this, on macOS arm64.
#
# Nothing can be fixed in the build for it, and a rerun costs a few minutes of
# machine time, so this passes over the recent runs and asks GitHub to rerun the
# failed jobs of those whose every failed job carries the check-run annotation
# naming that cause. A rerun is bounded four ways, none of which needs state held
# between passes: a run is left alone once its run_attempt reaches the limit the
# script holds, the run is read again before the POST and must still be completed,
# failed and at the attempt count this pass saw, the run is read once more after
# the POST and the attempt count must have grown, and a run is only asked for once
# its updated_at is an hour old -- three times this schedule's beat. Those are what
# keep a run that failed for a real reason, or a rerun GitHub accepts and does not
# run, from being asked for every twenty minutes. A cache ledger was tried and
# dropped: its entries keyed by this workflow's own run id are invisible to
# prune_ci_caches.yml, so they would accumulate for ever. The script's header says
# more, and says why a refused or unhonoured POST is an annotation rather than a
# failed job.
#
# The schedule only fires on the default branch, so this does nothing until the
# branch carrying it is merged: a workflow file on a side branch is not on a
# schedule. Until then it is run by hand with workflow_dispatch, dry-run or not.

on:
  schedule:
    # Every twenty minutes. A pass covers the last six hours, so a run left red
    # by a queue timeout is picked up on the next pass rather than on the next hour.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only list the runs that would be rerun'
        type: boolean
        default: false

permissions:
  # rerun-failed-jobs needs actions: write.
  actions: write
  # The check-run annotations are how a job says the runner never came; every
  # other permission is none, and the annotations read would be a 403 without
  # this one.
  checks: read
  contents: read

concurrency:
  group: rerun-unacquired
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci_rerun_unacquired.py
          sparse-checkout-cone-mode: false

      - name: Rerun runs no runner was found for
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          python3 -u scripts/ci_rerun_unacquired.py $flag

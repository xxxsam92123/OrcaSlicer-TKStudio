name: Re-run builds that lost a runner

# GitHub accepts a job, cannot find a hosted runner for it within its queue limit
# (fifteen minutes), and cancels it. The whole Build all run then goes red with
# nothing in the repository broken: seven of the sixteen failed or cancelled runs
# in the last sixty were exactly this, on macOS arm64.
#
# Nothing can be fixed in the build for it, and a rerun costs a few minutes of
# machine time, so this passes over the recent runs and asks GitHub to rerun the
# failed jobs of those whose every failed job carries the check-run annotation
# naming that cause. No state is held between passes, so every bound is recomputed
# from GitHub: a run is left alone once its run_attempt reaches the limit the
# script holds (--max-attempts, default 2), the run is read again before the POST
# and must still be completed, failed and at the attempt count this pass saw, the
# run is read once more after the POST so the attempt count is seen to have grown,
# and a run is skipped while its updated_at is younger than --min-age-minutes
# (default 60, three times this beat) -- which only bites when GitHub does move
# updated_at. So: an accepted rerun is asked for once in a run's life, because
# run_attempt=2 is over --max-attempts on the next pass; a run whose POST is
# refused, or answered 201 with updated_at unchanged, is asked again on every pass
# -- one POST per twenty minutes, three an hour, eighteen in the six-hour window,
# seventy-two a day -- and it does not settle, because nothing counts per run.
# --max-reruns-per-pass (default 3) is the only ceiling on that: nine asks an hour,
# fifty-four per window, two hundred and sixteen a day.
#
# A cache ledger was tried and dropped: its entries keyed by this workflow's own
# run id are invisible to prune_ci_caches.yml, so they would accumulate for ever.
# A pass keeping no state between passes is what keeps the pool clear. The script's
# header says more, and says why a refused or unhonoured POST is an annotation
# rather than a failed job.
#
# The schedule only fires on the default branch, so this does nothing until the
# branch carrying it is merged: a workflow file on a side branch is not on a
# schedule. Until then it is run by hand with workflow_dispatch, dry-run or not.

on:
  schedule:
    # Every twenty minutes. A pass covers the last six hours, so a run left red
    # by a queue timeout is picked up on the next pass rather than on the next hour.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only list the runs that would be rerun'
        type: boolean
        default: false

permissions:
  # rerun-failed-jobs needs actions: write.
  actions: write
  # The check-run annotations are how a job says the runner never came; every
  # other permission is none, and the annotations read would be a 403 without
  # this one.
  checks: read
  contents: read

concurrency:
  group: rerun-unacquired
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci_rerun_unacquired.py
          sparse-checkout-cone-mode: false

      - name: Rerun runs no runner was found for
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          python3 -u scripts/ci_rerun_unacquired.py $flag
